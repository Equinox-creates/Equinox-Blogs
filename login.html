<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - EQN Blogs</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="branding">
            <img src="assets/logo/branding-logo.png" alt="EQN Blogs Logo">
            <h1>EQN Blogs</h1>
        </div>
    </header>

    <main>
        <section class="form-section">
            <h2>Login</h2>
            <form id="login-form">
                <label for="username">Username:</label>
                <input type="text" id="username" name="username" required>

                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>

                <button type="submit">Login</button>
            </form>
            <p>Forgot your password? <a href="recover.html">Recover it here</a>.</p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 EQN Blogs. All rights reserved.</p>
    </footer>
</body>
</html>
