<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EQN Blogs</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <div class="branding">
            <img src="assets/logo/EQN Icon No bg.png" alt="EQN Blogs Logo">
            <h1>EQN Blogs</h1>
        </div>
        <nav>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">Create Blog</a></li>
                <li><a href="#">Login</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="drag-and-drop">
            <aside class="elements-panel">
                <h2>Elements</h2>
                <button data-element="text">Text Box</button>
                <button data-element="image">Image</button>
                <button data-element="card">Card</button>
                <button data-element="video">Video</button>
            </aside>
            <div class="canvas">
                <p>Drag and drop elements here to create your blog.</p>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 EQN Blogs. All rights reserved.</p>
    </footer>
</body>
</html>
