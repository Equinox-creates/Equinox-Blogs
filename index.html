<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>EQN Blogs</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body{
            margin:0;
            font-family:Segoe UI;
            background:linear-gradient(135deg,#0f172a,#1e293b);
            color:white;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            text-align:center;
        }

        .card{
            background:#1e293b;
            padding:50px;
            border-radius:20px;
            box-shadow:0 20px 50px rgba(0,0,0,0.5);
        }

        img{
            height:80px;
            margin-bottom:20px;
        }

        h1{
            margin-bottom:10px;
        }

        p{
            color:#94a3b8;
            margin-bottom:30px;
        }

        a{
            display:inline-block;
            padding:12px 25px;
            background:#2563eb;
            color:white;
            text-decoration:none;
            border-radius:10px;
            font-weight:bold;
            transition:0.3s;
        }

        a:hover{
            background:#1d4ed8;
        }
    </style>
</head>
<body>

<div class="card">
    <img src="assets/logo/EQN Icon No bg.png" alt="EQN Logo">
    <h1>EQN Blogs</h1>
    <p>This project requires a PHP server to run.</p>

    <a href="public/index.php">
        Open Application
    </a>
</div>

</body>
</html>
