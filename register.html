<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - EQN Blogs</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="branding">
            <img src="assets/logo/branding-logo.png" alt="EQN Blogs Logo">
            <h1>EQN Blogs</h1>
        </div>
    </header>

    <main>
        <section class="form-section">
            <h2>Create an Account</h2>
            <form id="register-form">
                <label for="username">Username:</label>
                <input type="text" id="username" name="username" required>

                <label for="email">Recovery Email:</label>
                <input type="email" id="email" name="email" required>

                <label for="phone">Recovery Phone Number:</label>
                <input type="tel" id="phone" name="phone" required>

                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>

                <label for="confirm-password">Confirm Password:</label>
                <input type="password" id="confirm-password" name="confirm-password" required>

                <button type="submit">Register</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 EQN Blogs. All rights reserved.</p>
    </footer>
</body>
</html>
